[project]
name = "colab-shell-mcp"
version = "0.1.0"
description = "FastMCP server for shell and file operations in a Google Colab runtime."
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "python-dotenv>=0.19",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["colab_shell_client*"]

[project.optional-dependencies]
test = ["pytest>=7.0.0", "pytest-mock>=3.10.0"]

[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
markers = ["integration: tests requiring a live Colab bridge"]
