name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.server }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        server:
          - android_mcp
          - docker_shell_mcp
          - firetv_mcp
          - grokipedia_mcp
          - lastfm_mcp
          - rapidapi_mcp
          - shell_mcp
          - subagent_mcp
          - web_mcp
          - webshell_mcp
          - yfinance_mcp

    defaults:
      run:
        working-directory: ${{ matrix.server }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.server }}/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-mock

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Run tests
        run: python -m pytest
