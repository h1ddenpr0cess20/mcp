[project]
name = "docker-shell-mcp"
version = "0.1.0"
description = "FastMCP server for sandboxed shell and file operations in Docker."
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "python-dotenv>=0.19",
]

[tool.setuptools.packages.find]
include = ["docker_shell_client*"]

[tool.setuptools.package-data]
docker_shell_client = ["sandbox/Dockerfile"]

[project.optional-dependencies]
test = ["pytest>=7.0.0", "pytest-mock>=3.10.0"]

[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
markers = ["integration: tests requiring a Docker daemon"]
